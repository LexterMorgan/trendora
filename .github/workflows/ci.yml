name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest tests/unit -q
        env:
          DATABASE_URL: postgresql+psycopg://user:pass@localhost:5432/trendora_test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx next typegen
        working-directory: web
      - run: npx tsc --noEmit
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run lint
        working-directory: web
      - name: Install pinned Playwright driver and browser
        working-directory: web
        env:
          PLAYWRIGHT_VERSION: "1.55.0"
        run: |
          npm install --no-save --no-package-lock "playwright@$PLAYWRIGHT_VERSION"
          npx playwright install --with-deps chromium
      - name: Isolated browser regressions (Webpack build included)
        working-directory: web
        env:
          TRENDORA_BROWSER_DRIVER: playwright
          TMPDIR: ${{ runner.temp }}
        run: npm run test:browser
      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-regressions
          path: |
            ${{ runner.temp }}/trendora-browser-*
            web/npm-debug.log*
          if-no-files-found: ignore
          retention-days: 7
